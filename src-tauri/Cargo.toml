[package]
name = "anomaly-dashboard"
version = "0.1.0"
description = "Anomaly Dashboard desktop shell"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "Dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
